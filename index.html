<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DND Insulation & Construction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f8f8f8;
        }
        h1 {
            color: #2c3e50;
        }
        button {
            padding: 20px 40px;
            margin: 20px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #e67e22;
            color: #fff;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #d35400;
        }
    </style>
</head>
<body>

    <h1>Welcome to DND Insulation & Construction</h1>
    <p>Click below to learn more about our services or get in touch.</p>

    <button onclick="openPage('service')">Service</button>
    <button onclick="openPage('contact')">Contact</button>

    <script>
        function openPage(page) {
            if(page === 'service') {
                window.open('./service.html', '_blank'); // opens Service page in new tab
            } else if(page === 'contact') {
                window.open('./contact.html', '_blank'); // opens Contact page in new tab
            }
        }
    </script>

</body>
</html>
